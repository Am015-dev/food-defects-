name: Daily catalog ingest

# Runs the ingest on a GitHub runner (several GB of RAM) writing straight
# to the Render Postgres, rather than making the 512MB web service hold
# whole shop catalogs in memory -- that repeatedly got it OOM-killed.

on:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC daily
  workflow_dispatch: {}  # allows manually triggering a run from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ingest all shops
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python ingest.py

      - name: Email on failure
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: python notify.py --ingest-failed

      # Price history is the one thing here that can't be re-fetched --
      # e-food doesn't expose yesterday's prices, only today's. Render's
      # free Postgres has no backups of its own, so dump the database
      # after every successful ingest and keep it as a workflow artifact.
      - name: Install postgresql-client
        if: success()
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump database
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pg_dump "$DATABASE_URL" --format=custom --file=food_defects_backup.dump

      # GitHub Actions artifacts are downloadable by anyone with repo
      # read access (or an actions:read token) for the whole retention
      # window -- a materially lower bar than access to the DATABASE_URL
      # secret itself. Encrypt the dump so a repo-read grant doesn't
      # double as a full price-history export grant.
      - name: Encrypt database backup
        if: success()
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase-fd 0 \
            --output food_defects_backup.dump.gpg \
            food_defects_backup.dump <<< "$BACKUP_ENCRYPTION_PASSPHRASE"
          rm -f food_defects_backup.dump

      - name: Upload database backup
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: food-defects-db-backup
          path: food_defects_backup.dump.gpg
          retention-days: 30
