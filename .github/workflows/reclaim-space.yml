name: "Emergency: reclaim Postgres disk space"

# One-off, manual-only maintenance run -- see scripts/reclaim_space.py.
# Not scheduled: this is a stopgap for the "food-defects-db is over 90%
# of its free-tier storage" warning, not part of the regular pipeline.
# Safe to delete this workflow (and the script) once the database has
# moved to a provider with more headroom.

on:
  workflow_dispatch:
    inputs:
      prune_days:
        description: >-
          Leave empty to only VACUUM (no data loss). Set to a day count
          (e.g. 3) to also prune item_prices older than that many days
          before vacuuming -- deletes irreplaceable price history beyond
          the normal retention window, so only set this if a plain
          vacuum didn't free enough space.
        required: false
      vacuum_full:
        description: >-
          Set to "1" to run VACUUM (FULL, ANALYZE) instead of plain
          VACUUM -- actually shrinks the table file (plain VACUUM only
          marks space reusable for future inserts). Takes an exclusive
          lock on item_prices for the duration; on a provider whose
          storage requires spare local disk to build the compacted copy
          this can fail outright (it did against Render's Postgres).
        required: false

jobs:
  reclaim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Reclaim disk space
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RECLAIM_PRUNE_DAYS: ${{ inputs.prune_days }}
          RECLAIM_VACUUM_FULL: ${{ inputs.vacuum_full }}
          PYTHONPATH: .
        run: python scripts/reclaim_space.py
