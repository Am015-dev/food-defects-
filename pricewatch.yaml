politeness:
  delay_seconds: 1.5
  timeout: 20
  respect_robots: true
  user_agent: "pricewatch/0.1 (internal price QA; contact: you@example.com)"

sources:
  # offline fixture — proves the engine works without hitting the network.
  # this reproduces the incident that triggered the tracker: a fixed-amount
  # promo drove two SKUs to €0,00 with no struck-through original and no
  # unit price rendered, plus a 90%+ near-miss on a third line.
  - name: "fixture: observed cart"
    type: file
    path: fixture_cart.json
    items_path: "data.categories[].items[]"
    price_scale: euro
    fields:
      sku: id
      title: name
      price: price
      original_price: initial_price
      discount_amount: discount_amount
      discount_pct: discount
      unit_size: quantity
      unit_label: unit
      unit_price: price_per_unit

  # -- live via the Apify platform (sanctioned, keyed API) -------------------
  # Reaches e-food's PUBLIC listing data through the studio-amba/efood-scraper
  # actor. No login, no Cloudflare bypass — Apify runs the actor and hands back
  # a dataset. Set your token first:  export APIFY_TOKEN=apify_api_xxx
  #
  # SCOPE: this actor returns STORE-LEVEL data (deliveryCost, minimumOrder,
  # rating, offers, hours) — NOT individual dish prices. Per the actor's own
  # docs, menu/dish prices require authenticated access and are not available
  # here. The dish-price rules were written for menu lines: mapping
  # price=deliveryCost means NEGATIVE_PRICE still catches a genuinely broken
  # (< 0) delivery fee, but ZERO_PRICE will also fire on every free-delivery
  # shop, which is normal — filter those out (e.g. cases --rule NEGATIVE_PRICE)
  # or add store-specific rules if you monitor this feed seriously.
  #
  # - name: "efood athens stores (apify)"
  #   type: apify
  #   actor: "studio-amba/efood-scraper"
  #   # dataset_id: "abc123"             # or read an already-produced dataset
  #   token_env: APIFY_TOKEN
  #   input:
  #     location: "Athens"
  #     coverage: "city-wide"            # grid-sweep the whole metro
  #     maxResults: 20000
  #     onlyOpen: false
  #   items_path: ""                     # dataset is a top-level array
  #   price_scale: euro
  #   fields:
  #     sku: efoodId
  #     title: name
  #     price: deliveryCost
  #     unit_size: minimumOrder
  #     unit_label: vertical

  # -- e-food OFFICIAL Partner API (sanctioned, OAuth2, gets dish prices) -----
  # This is the legal, no-bypass route to product-level pricing and promotions.
  # Requires being an e-food partner: get client_id/client_secret from your
  # e-food Account Manager (Delivery Hero developer program,
  # https://developer-qc.e-food.gr). It reads YOUR chain's catalogue, so it
  # sees the exact product-price / promotion defects the tracker is built for.
  #
  # Set credentials in the environment, never here:
  #   export EFOOD_CLIENT_ID=...
  #   export EFOOD_CLIENT_SECRET=...
  #
  # Fill in the catalogue read endpoint + JSON shape from your Partner API docs
  # (the exact path/fields come with your credentials). The auth block below is
  # correct for the Delivery Hero token endpoint.
  #
  # - name: "efood partner catalogue"
  #   type: json
  #   url: "https://e-food.partner.deliveryhero.io/v2/<catalogue read endpoint>"
  #   auth:
  #     type: oauth2_client_credentials
  #     token_url: "https://e-food.partner.deliveryhero.io/v2/oauth/token"
  #     client_id_env: EFOOD_CLIENT_ID
  #     client_secret_env: EFOOD_CLIENT_SECRET
  #   items_path: "products[]"           # <- set from the real response shape
  #   price_scale: euro                  # or 'cents' if the API returns integers
  #   fields:
  #     sku: sku
  #     title: name
  #     price: price
  #     original_price: original_price
  #     discount_amount: discount_amount
  #     discount_pct: discount_percentage

  # -- template for a real catalogue endpoint --------------------------------
  # 1. Open the shop page in Chrome -> DevTools -> Network -> Fetch/XHR.
  # 2. Reload, find the response with product names and prices.
  # 3. Fill in the endpoint + field mapping below and un-comment.
  #
  # - name: "shop 1234 catalogue"
  #   type: json
  #   url: "https://<host>/<the endpoint you copied>"
  #   items_path: "data.categories[].items[]"
  #   page_param: page
  #   max_pages: 20
  #   price_scale: euro
  #   fields:
  #     sku: id
  #     title: name
  #     price: price
  #     original_price: initial_price
  #     discount_amount: discount_amount
  #     discount_pct: discount
  #     unit_size: quantity
  #     unit_label: unit
  #     unit_price: price_per_unit
