databases:
  - name: food-defects-db
    plan: free
    databaseName: food_defects
    user: food_defects

services:
  - type: web
    name: food-defects-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn webapp:app --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: food-defects-db
          property: connectionString
      - key: INGEST_SECRET
        generateValue: true
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: NOTIFY_EMAIL_TO
        sync: false
