databases:
  - name: food-defects-db
    plan: free
    databaseName: food_defects
    user: food_defects

services:
  - type: web
    name: food-defects-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn webapp:app
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: food-defects-db
          property: connectionString

  - type: cron
    name: food-defects-ingest
    env: python
    plan: free
    schedule: "0 5 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python ingest.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: food-defects-db
          property: connectionString
